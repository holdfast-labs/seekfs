<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seekfs</title>
    <link rel="icon" href="/assets/seekfs-radar.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/seekfs.ico" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="searchbar">
        <input id="query" class="search-input" type="search" autocomplete="off" spellcheck="false" autofocus placeholder="Search" />
        <button id="content-toggle" class="mode-toggle" type="button" aria-pressed="false" title="Search inside files (Ctrl+Shift+F)">Contents</button>
      </section>

      <section class="results-wrap">
        <table class="results">
          <colgroup>
            <col class="col-name" />
            <col class="col-path" />
            <col class="col-size" />
            <col class="col-date" />
          </colgroup>
          <thead>
            <tr>
              <th class="name-col" data-sort="name">Name</th>
              <th data-sort="path">Path</th>
              <th class="size-col" data-sort="size">Size</th>
              <th class="date-col" data-sort="modified">Date Modified</th>
            </tr>
          </thead>
          <tbody id="results" tabindex="-1"></tbody>
        </table>
        <div id="empty" class="empty">Type to search</div>
      </section>

      <section class="footer">
        <span id="summary">Ready</span>
        <span id="selected"></span>
        <span id="content-status" class="content-status"></span>
        <span id="health" class="health" title="">
          <span id="health-dot" class="health-dot health-ok"></span>
          <span id="health-text"></span>
        </span>
      </section>
    </main>

    <nav id="menu" class="context-menu">
      <button data-action="open">Open</button>
      <button data-action="reveal">Open Path</button>
      <button data-action="copy">Copy Full Path</button>
      <button data-action="copy-name">Copy Name</button>
      <hr />
      <button data-action="rename">Rename</button>
      <button data-action="properties">Properties</button>
      <button data-action="delete" class="danger">Move to Recycle Bin</button>
    </nav>

    <script src="/query.js"></script>
    <script src="/util.js"></script>
    <script src="/main.js"></script>
  </body>
</html>
