<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seekfs</title>
    <link rel="icon" href="/assets/seekfs-radar.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/seekfs.ico" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div class="brand" title="seekfs — instant file search">
          <img class="brand-logo" src="/assets/seekfs.ico" alt="" width="18" height="18" />
          <span class="brand-name">seekfs</span>
        </div>
      </header>

      <section class="prompt-wrap" role="search">
        <span class="prompt-glyph" aria-hidden="true">&gt;</span>
        <input id="query" class="prompt-input" type="search" autocomplete="off" spellcheck="false" autofocus aria-label="Search files" />
        <button id="clear" class="prompt-clear" type="button" aria-label="Clear search" hidden>×</button>
        <kbd class="prompt-kbd" title="Focus search">Ctrl K</kbd>
      </section>

      <section class="results-wrap">
        <table class="results">
          <colgroup>
            <col class="col-name" />
            <col class="col-path" />
            <col class="col-size" />
            <col class="col-date" />
          </colgroup>
          <thead>
            <tr>
              <th class="name-col" data-sort="name">Name</th>
              <th data-sort="path">Path</th>
              <th class="size-col" data-sort="size">Size</th>
              <th class="date-col" data-sort="modified">Date Modified</th>
            </tr>
          </thead>
          <tbody id="results" tabindex="-1"></tbody>
        </table>
        <div id="empty" class="empty">
          <div class="empty-title">Type to search</div>
        </div>
      </section>

      <footer class="footer">
        <span id="summary" class="summary">Ready</span>
        <span id="selected" class="selected-path"></span>
        <span class="footer-right">
          <span id="count" class="count">0</span>
          <span id="health" class="health" title="">
            <span id="health-dot" class="health-dot health-ok"></span>
            <span id="health-text"></span>
          </span>
        </span>
      </footer>
    </main>

    <nav id="menu" class="context-menu" aria-label="Result actions">
      <button data-action="open">Open <span class="menu-kbd">Enter</span></button>
      <button data-action="reveal">Open Path</button>
      <button data-action="copy">Copy Full Path <span class="menu-kbd">Ctrl+C</span></button>
      <button data-action="copy-name">Copy Name</button>
      <hr />
      <button data-action="rename">Rename <span class="menu-kbd">F2</span></button>
      <button data-action="properties">Properties</button>
      <button data-action="delete" class="danger">Move to Recycle Bin <span class="menu-kbd">Del</span></button>
    </nav>

    <script src="/query.js"></script>
    <script src="/util.js"></script>
    <script src="/main.js"></script>
  </body>
</html>
